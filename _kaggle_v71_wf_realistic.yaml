# Config robusta y realista para Kaggle / v71

pair: "XRP_USDT"
tf: "5m"

data:
  prebuilt_dir: artifacts/datasets
  parquet_path: artifacts/datasets/train_XRP_USDT_5m_v71.parquet
  time_col: ds
  strict_time: true

labels:
  vol_scaled: true

features:
  seq_len: 192
  adx_period: 14
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  donchian_period: 20
  vol_lookback: 48
  chop_period: 14
  twin_range_fast: 7
  twin_range_slow: 28

model:
  d_model: 160
  nhead: 8
  num_layers: 3
  dropout: 0.10
  quantiles: [0.10, 0.50, 0.90]
  norm_first: true

train:
  device: "auto"
  max_folds: 3
  seed: 42
  epochs: 50
  early_stop_patience: 6
  batch_size: 2048
  lr: 2.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.05
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  amp: true
  grad_accum_steps: 1
  reg_alpha: 1.0
  cls_alpha_side: 1.0
  cls_alpha_hit: 0.8
  cls_alpha_regime: 0.5
  cls_alpha_event: 0.5
  side_class_weights: [1.0, 2.0, 2.0]
  hit_class_weights: [2.0, 1.0, 2.0]
  regime_class_weights: [1.2, 1.0, 1.0, 1.5]
  event_class_weights: [1.0, 1.3, 1.3, 1.8]
  event_weight: 1.5

backtest:
  fees_bps_roundtrip: 8.0
  spread_bps_roundtrip: 4.0
  slippage_bps_roundtrip: 6.0
  latency_bars: 1
  leverage: 3.0
  risk_fraction: 0.25
  max_hold_bars: 16
  tp_atr_mult: 1.6
  sl_atr_mult: 1.1
  exit_ev_min: 0.0
  fee_rate: 0.0004
  slippage: 0.0002
  thr_lookback_bars: 4000
  score_q: 0.70
  ood_q: 0.90
  ev_q: 0.75
  p_side_min: 0.52
  p_tp_min: 0.20
  p_sl_max: 0.45
  ev_abs_min: 0.0
  ev_buffer_mult: 1.0
  q_width_mult: 2.5
  use_topk: true
  top_k: 10
  cooldown_bars: 1
  regime_policy:
    range_p_max_for_trade: 0.65
    breakout_p_min: 0.45
    rebound_p_min: 0.45
    spike_p_max: 0.55

tuner:
  n_trials: 60
  min_trades: 200
  min_drawdown: 0.002
  pf_cap: 20.0
  objective: "calmar"
